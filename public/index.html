<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Seven 67</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#050506">
<script>try{var t=localStorage.getItem('tema')||'gelap';if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'terang':'gelap';document.documentElement.dataset.theme=t;}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Six Seven 67">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/vendor/inter/index.css">
<link rel="stylesheet" href="/vendor/mono/500.css">
<link rel="stylesheet" href="/vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="/vendor/phosphor/fill/style.css">
<link rel="stylesheet" href="/vendor/phosphor/bold/style.css">
<link rel="stylesheet" href="/vendor/phosphor/duotone/style.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#content">Langsung ke konten</a>
<div class="boot" id="boot"><i class="ph-fill ph-books"></i><b>Menyiapkan Six Seven 67…</b><small>Memeriksa akun dan menyinkronkan data.</small></div>

<div class="aurora" aria-hidden="true"></div>
<div class="shell" id="shell" aria-busy="true">
  <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
    <div class="brand">
      <button type="button" class="brand-btn" id="brandBtn" aria-label="Ciutkan sidebar" title="Ciutkan / lebarkan sidebar (Ctrl+B)">
        <img class="brand-mark" src="/logo.svg" alt="" width="38" height="38"><i class="ph ph-sidebar-simple brand-buka" aria-hidden="true"></i>
      </button>
      <div class="brand-text"><strong>Six Seven 67</strong><small>Manajemen Perkuliahan</small></div>
      <button type="button" class="icon-btn side-toggle" id="sideToggle" aria-label="Ciutkan sidebar" title="Ciutkan sidebar (Ctrl+B)"><i class="ph ph-sidebar-simple"></i></button>
    </div>
    <nav class="nav" id="nav" aria-label="Menu"></nav>
    <div class="side-foot">
      <div class="bot-pill"><span class="dot" id="botDot" aria-hidden="true"></span><span id="botText" role="status">Memeriksa bot…</span></div>
      <div class="user-card">
        <button class="profile-chip" id="profileBtn" aria-label="Buka profil saya"><span class="avatar" id="avatar" aria-hidden="true"></span><span class="who"><b id="userName"></b><small id="userRole"></small></span></button>
        <button class="tiny-btn" id="logoutBtn" aria-label="Keluar" title="Keluar"><i class="ph ph-sign-out"></i></button>
      </div>
    </div>
  </aside>
  <button class="scrim" id="scrim" aria-label="Tutup menu"></button>
  <nav class="tabbar" id="tabbar" aria-label="Menu utama"></nav>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Buka menu"><i class="ph ph-list"></i></button>
      <div class="page-title"><p id="pageSub"></p><h1 id="pageTitle" tabindex="-1"></h1></div>
      <label class="top-search"><i class="ph ph-magnifying-glass"></i><input type="search" id="globalSearch" placeholder="Cari mata kuliah, tugas…" aria-label="Cari mata kuliah atau tugas"></label>
      <div class="top-actions">
        <button class="icon-btn" id="cariBtn" aria-label="Cari cepat (Ctrl+K)" title="Cari cepat (Ctrl+K)"><i class="ph ph-command"></i></button>
        <button class="icon-btn" id="temaBtn" aria-label="Ganti tema terang/gelap" title="Ganti tema"><i class="ph ph-sun"></i></button>
        <button class="pill-btn" id="bellBtn" aria-label="Tugas aktif"><i class="ph ph-bell"></i><span id="bellCount">0</span></button>
      </div>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>

<dialog class="modal" id="modal"><form id="modalForm" novalidate>
  <div class="modal-head"><div><div class="eyebrow" id="mEyebrow"></div><h2 id="mTitle"></h2></div><button type="button" class="tiny-btn" data-close aria-label="Tutup"><i class="ph ph-x"></i></button></div>
  <div class="modal-body" id="mBody"></div>
  <div class="modal-foot" id="mFoot"></div>
</form></dialog>

<dialog class="modal confirm" id="confirmDlg" aria-labelledby="cTitle" aria-describedby="cText">
  <div class="modal-head"><div><h2 id="cTitle"></h2></div></div>
  <div class="modal-body"><p id="cText" class="muted"></p></div>
  <div class="modal-foot"><button type="button" class="btn btn-secondary" id="cNo">Batal</button><button type="button" class="btn btn-danger" id="cYes"></button></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"><i class="ph-fill ph-check-circle"></i><p id="toastText"></p><button class="tiny-btn" id="toastClose" aria-label="Tutup"><i class="ph ph-x"></i></button></div>

<dialog class="palette" id="palette" aria-label="Cari cepat">
  <div class="pal-box"><i class="ph ph-magnifying-glass"></i><input id="palInput" placeholder="Cari menu, mata kuliah, tugas, ujian…" autocomplete="off" aria-label="Kata kunci"><kbd>Esc</kbd></div>
  <div class="pal-list" id="palList" role="listbox"></div>
</dialog>

<script src="/app.js"></script>
<script src="/fitur.js"></script>
<script src="/praktikum.js"></script>
</body>
</html>
