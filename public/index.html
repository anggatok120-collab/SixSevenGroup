<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengingat Kuliah</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e6e4df;
  --accent:#1f7a5a;--accent-soft:#e3f2ec;--warn:#b5580b;--warn-soft:#fdf0e3;
  --danger:#b42318;--danger-soft:#fde8e7;--radius:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141416;--card:#1d1d20;--ink:#ececee;--muted:#9a9aa2;--line:#2c2c31;
  --accent:#4cc79a;--accent-soft:#183329;--warn:#f0a55b;--warn-soft:#3a2914;
  --danger:#f2766b;--danger-soft:#3b1c1a;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-size:22px;margin:0;letter-spacing:-.02em}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--line);color:var(--ink)}
button.primary{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.primary{color:#0d1f18}}
button.ghost{background:none;padding:6px 8px;color:var(--muted)}
button.ghost:hover{color:var(--ink)}
button.danger{background:var(--danger-soft);color:var(--danger)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.today{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:24px}
@media (max-width:640px){.today{grid-template-columns:1fr}}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;background:none;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.list{display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item .time{font-variant-numeric:tabular-nums;font-weight:600;min-width:92px;color:var(--accent)}
.item .main{flex:1;min-width:0}
.item .title{font-weight:600}
.item .sub{color:var(--muted);font-size:13px}
.item.done{opacity:.55}.item.done .title{text-decoration:line-through}
.item .actions{display:flex;gap:2px}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:none;padding:0;flex:none;margin-top:1px}
.chk.on{background:var(--accent);border-color:var(--accent)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.day{margin-bottom:18px}
.day h3{font-size:14px;margin:0 0 8px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
dialog{border:0;border-radius:18px;padding:0;background:var(--card);color:var(--ink);width:min(440px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.4)}
form{padding:20px;display:grid;gap:12px}
form h3{margin:0 0 4px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.err{color:var(--danger);font-size:13px;min-height:1em}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 Pengingat Kuliah<small id="tanggal"></small></h1>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="pill" id="status">…</span>
      <button class="ghost" id="authBtn">Login</button>
    </div>
  </header>

  <section class="today">
    <div class="card"><h2>Kelas hari ini</h2><div id="todayKelas" class="list"></div></div>
    <div class="card"><h2>Segera</h2><div id="soon" class="list"></div></div>
  </section>

  <nav class="tabs">
    <button data-tab="jadwal" class="on">Jadwal</button>
    <button data-tab="tugas">Tugas</button>
    <button data-tab="ujian">Ujian</button>
  </nav>

  <section id="tab-jadwal">
    <div class="toolbar"><span class="sub"></span><button class="primary admin" data-add="kelas">+ Tambah kelas</button></div>
    <div id="jadwal"></div>
  </section>
  <section id="tab-tugas" class="hidden">
    <div class="toolbar"><label style="display:flex;gap:6px;align-items:center;flex-direction:row"><input type="checkbox" id="showDone" style="width:auto"> Tampilkan yang selesai</label><button class="primary admin" data-add="tugas">+ Tambah tugas</button></div>
    <div id="tugas" class="list"></div>
  </section>
  <section id="tab-ujian" class="hidden">
    <div class="toolbar"><span></span><button class="primary admin" data-add="ujian">+ Tambah ujian</button></div>
    <div id="ujian" class="list"></div>
  </section>
</div>

<dialog id="loginDlg"><form id="loginForm">
  <h3>Login admin</h3>
  <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
  <div class="err"></div>
  <div class="btns"><button type="button" data-close>Batal</button><button class="primary">Masuk</button></div>
</form></dialog>

<dialog id="editDlg"><form id="editForm">
  <h3 id="editTitle"></h3>
  <div id="fields" style="display:grid;gap:12px"></div>
  <div class="err"></div>
  <div class="btns"><button type="button" class="danger hidden" id="delBtn" style="margin-right:auto">Hapus</button><button type="button" data-close>Batal</button><button class="primary">Simpan</button></div>
</form></dialog>

<div class="toast" id="toast"></div>

<script>
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state = { kelas: [], tugas: [], ujian: [], status: {} }, admin = false, publicView = false;

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body && JSON.stringify(opts.body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'Gagal'), { status: r.status });
  return j;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

// Waktu dari server berupa "YYYY-MM-DD HH:mm" waktu lokal kampus
const parse = (s) => { const [d, t] = s.split(' '); const [y, m, dd] = d.split('-').map(Number); const [h, mi] = t.split(':').map(Number); return new Date(y, m - 1, dd, h, mi); };
const pretty = (s) => { const d = parse(s); return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} · ${s.slice(11)}`; };
// ms = epoch dari server, supaya hitung mundur benar walau zona waktu HP beda
function sisa(at) {
  const ms = at - Date.now(), min = Math.round(ms / 60000);
  if (ms < 0) return { txt: 'lewat', cls: 'danger' };
  if (min < 60) return { txt: `${min} menit`, cls: 'danger' };
  const jam = Math.round(min / 60);
  if (jam < 24) return { txt: `${jam} jam`, cls: 'danger' };
  const hari = Math.floor(min / 1440);
  return { txt: `${hari} hari`, cls: hari <= 3 ? 'warn' : '' };
}

async function load() {
  try { ({ admin, publicView } = await api('/api/me')); } catch {}
  $('#authBtn').textContent = admin ? 'Logout' : 'Login';
  document.querySelectorAll('.admin').forEach((el) => el.classList.toggle('hidden', !admin));
  try { state = await api('/api/data'); }
  catch (e) { if (e.status === 401) { $('#loginDlg').showModal(); } return; }
  render();
}

function render() {
  const now = new Date();
  $('#tanggal').textContent = `${HARI[now.getDay()]}, ${now.getDate()} ${BULAN[now.getMonth()]} ${now.getFullYear()}`;
  const st = state.status || {};
  const pill = $('#status');
  pill.className = 'pill ' + (st.wa && st.grup ? 'ok' : 'bad');
  pill.textContent = st.wa ? (st.grup ? 'Bot aktif' : 'Grup belum diatur') : 'Bot offline';

  const kelasLi = (k, editable) => `<div class="item"><div class="time">${k.mulai}${k.selesai ? '–' + k.selesai : ''}</div>
    <div class="main"><div class="title">${esc(k.matkul)}</div><div class="sub">${[k.ruang, k.dosen].filter(Boolean).map(esc).join(' · ') || '&nbsp;'}</div></div>
    ${editable && admin ? `<div class="actions"><button class="ghost" data-edit="kelas" data-id="${k.id}">Ubah</button></div>` : ''}</div>`;

  const today = state.kelas.filter((k) => k.hari === now.getDay());
  $('#todayKelas').innerHTML = today.length ? today.map((k) => kelasLi(k)).join('') : '<div class="empty">Tidak ada kelas hari ini 🎉</div>';

  const soon = [
    ...state.tugas.filter((t) => !t.selesai).map((t) => ({ at: t.deadline, ms: t.ms, html: `<span class="tag">Tugas</span>${esc(t.matkul)}: ${esc(t.judul)}` })),
    ...state.ujian.filter((u) => u.ms > Date.now()).map((u) => ({ at: u.waktu, ms: u.ms, html: `<span class="tag warn">${esc(u.jenis)}</span>${esc(u.matkul)}` })),
  ].filter((x) => x.ms - Date.now() < 7 * 864e5).sort((a, b) => a.ms - b.ms).slice(0, 5);
  $('#soon').innerHTML = soon.length ? soon.map((x) => { const s = sisa(x.ms); return `<div class="item"><div class="main"><div class="title">${x.html}</div><div class="sub">${pretty(x.at)} · <b>${s.txt}</b></div></div></div>`; }).join('') : '<div class="empty">Tidak ada deadline 7 hari ke depan.</div>';

  $('#jadwal').innerHTML = [1, 2, 3, 4, 5, 6, 0].map((h) => {
    const ks = state.kelas.filter((k) => k.hari === h);
    if (!ks.length) return '';
    return `<div class="day"><h3>${HARI[h]}</h3><div class="list">${ks.map((k) => kelasLi(k, true)).join('')}</div></div>`;
  }).join('') || `<div class="empty">Jadwal masih kosong.${admin ? ' Klik "Tambah kelas" untuk mulai.' : ''}</div>`;

  const showDone = $('#showDone').checked;
  const tugas = state.tugas.filter((t) => showDone || !t.selesai);
  $('#tugas').innerHTML = tugas.length ? tugas.map((t) => { const s = sisa(t.ms); return `<div class="item ${t.selesai ? 'done' : ''}">
    ${admin ? `<button class="chk ${t.selesai ? 'on' : ''}" data-toggle="${t.id}" title="Tandai selesai"></button>` : ''}
    <div class="main"><div class="title">${esc(t.judul)}</div><div class="sub"><span class="tag">${esc(t.matkul)}</span>${pretty(t.deadline)}${t.selesai ? '' : ` · <span class="tag ${s.cls}">${s.txt}</span>`}</div></div>
    ${admin ? `<div class="actions"><button class="ghost" data-edit="tugas" data-id="${t.id}">Ubah</button></div>` : ''}</div>`; }).join('') : '<div class="empty">Tidak ada tugas. Santai dulu ☕</div>';

  $('#ujian').innerHTML = state.ujian.length ? state.ujian.map((u) => { const s = sisa(u.ms); const lewat = s.txt === 'lewat'; return `<div class="item ${lewat ? 'done' : ''}">
    <div class="main"><div class="title"><span class="tag warn">${esc(u.jenis)}</span>${esc(u.matkul)}</div><div class="sub">${pretty(u.waktu)}${u.ruang ? ' · ' + esc(u.ruang) : ''}${lewat ? '' : ` · <span class="tag ${s.cls}">${s.txt}</span>`}</div></div>
    ${admin ? `<div class="actions"><button class="ghost" data-edit="ujian" data-id="${u.id}">Ubah</button></div>` : ''}</div>`; }).join('') : '<div class="empty">Belum ada ujian terjadwal.</div>';
}

// ---- Form tambah/ubah ----
const FORMS = {
  kelas: { label: 'kelas', fields: (v) => `
    <label>Mata kuliah<input name="matkul" required value="${esc(v.matkul)}"></label>
    <label>Hari<select name="hari">${[1,2,3,4,5,6,0].map((h) => `<option value="${h}" ${+v.hari === h ? 'selected' : ''}>${HARI[h]}</option>`).join('')}</select></label>
    <div class="row"><label>Mulai<input type="time" name="mulai" required value="${esc(v.mulai)}"></label><label>Selesai<input type="time" name="selesai" value="${esc(v.selesai)}"></label></div>
    <div class="row"><label>Ruang<input name="ruang" value="${esc(v.ruang)}"></label><label>Dosen<input name="dosen" value="${esc(v.dosen)}"></label></div>` },
  tugas: { label: 'tugas', fields: (v) => `
    <label>Mata kuliah<input name="matkul" required value="${esc(v.matkul)}" list="matkulList"></label>
    <label>Judul tugas<input name="judul" required value="${esc(v.judul)}"></label>
    <label>Deadline<input type="datetime-local" name="deadline" required value="${esc((v.deadline || '').replace(' ', 'T'))}"></label>
    ${v.id ? `<label style="flex-direction:row;display:flex;gap:6px;align-items:center"><input type="checkbox" name="selesai" style="width:auto" ${v.selesai ? 'checked' : ''}> Sudah selesai</label>` : ''}` },
  ujian: { label: 'ujian', fields: (v) => `
    <label>Mata kuliah<input name="matkul" required value="${esc(v.matkul)}" list="matkulList"></label>
    <label>Jenis<select name="jenis">${['UTS','UAS','Kuis','Praktikum'].map((j) => `<option ${v.jenis === j ? 'selected' : ''}>${j}</option>`).join('')}</select></label>
    <label>Waktu<input type="datetime-local" name="waktu" required value="${esc((v.waktu || '').replace(' ', 'T'))}"></label>
    <label>Ruang<input name="ruang" value="${esc(v.ruang)}"></label>` },
};
let editing = null;
function openEdit(type, id) {
  const v = id ? state[type].find((x) => x.id === id) : (type === 'kelas' ? { hari: new Date().getDay() || 1 } : {});
  editing = { type, id };
  $('#editTitle').textContent = `${id ? 'Ubah' : 'Tambah'} ${FORMS[type].label}`;
  const matkul = [...new Set(state.kelas.map((k) => k.matkul))];
  $('#fields').innerHTML = FORMS[type].fields(v) + `<datalist id="matkulList">${matkul.map((m) => `<option value="${esc(m)}">`).join('')}</datalist>`;
  $('#delBtn').classList.toggle('hidden', !id);
  $('#editForm .err').textContent = '';
  $('#editDlg').showModal();
}
$('#editForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target), body = Object.fromEntries(fd);
  body.selesai = fd.has('selesai');
  const { type, id } = editing;
  try {
    await api(`/api/${type}${id ? '/' + id : ''}`, { method: id ? 'PUT' : 'POST', body });
    $('#editDlg').close(); toast('Tersimpan'); load();
  } catch (err) { $('#editForm .err').textContent = err.message; }
});
$('#delBtn').addEventListener('click', async () => {
  if (!confirm('Hapus data ini?')) return;
  const { type, id } = editing;
  try { await api(`/api/${type}/${id}`, { method: 'DELETE' }); $('#editDlg').close(); toast('Dihapus'); load(); }
  catch (err) { $('#editForm .err').textContent = err.message; }
});

document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
    ['jadwal', 'tugas', 'ujian'].forEach((t) => $('#tab-' + t).classList.toggle('hidden', t !== b.dataset.tab));
  }
  if (b.dataset.add) openEdit(b.dataset.add);
  if (b.dataset.edit) openEdit(b.dataset.edit, Number(b.dataset.id));
  if (b.dataset.close !== undefined) b.closest('dialog').close();
  if (b.dataset.toggle) {
    const t = state.tugas.find((x) => x.id === Number(b.dataset.toggle));
    await api(`/api/tugas/${t.id}`, { method: 'PUT', body: { ...t, selesai: !t.selesai } });
    toast(t.selesai ? 'Ditandai belum selesai' : 'Mantap, tugas selesai! ✅'); load();
  }
});
$('#showDone').addEventListener('change', render);
$('#authBtn').addEventListener('click', async () => {
  if (admin) { await api('/api/logout', { method: 'POST' }); toast('Sudah logout'); load(); }
  else { $('#loginForm .err').textContent = ''; $('#loginDlg').showModal(); }
});
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try { await api('/api/login', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) }); $('#loginDlg').close(); e.target.reset(); toast('Berhasil login'); load(); }
  catch (err) { $('#loginForm .err').textContent = err.message; }
});
load();
setInterval(load, 60000);
</script>
</body>
</html>
