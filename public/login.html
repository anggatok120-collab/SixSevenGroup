<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · Pengingat Kuliah</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0a'/%3E%3Cpath d='M9 8h6v16H9zM17 8h6v16h-6z' fill='%23fafafa'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/manrope/index.css">
<link rel="stylesheet" href="/vendor/serif/latin-400.css">
<link rel="stylesheet" href="/vendor/serif/latin-400-italic.css">
<link rel="stylesheet" href="/vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="/vendor/phosphor/fill/style.css">
<link rel="stylesheet" href="/vendor/phosphor/bold/style.css">
<link rel="stylesheet" href="/vendor/phosphor/duotone/style.css">
<style>
:root { --bg:#fafafa; --card:#fff; --line:#e5e5e5; --line-2:#d4d4d4; --ink:#0a0a0a; --muted:#525252; --inv:#0a0a0a; --inv-ink:#fafafa; color-scheme: light; }
:root[data-theme="dark"] { --bg:#0a0a0a; --card:#111111; --line:#262626; --line-2:#333333; --ink:#fafafa; --muted:#a3a3a3; --inv:#fafafa; --inv-ink:#0a0a0a; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; font: 15px/1.55 "Manrope Variable", "Manrope", system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
.card { width: min(26rem, 100%); background: transparent; padding: 40px 0; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
.tile { display: none; }
.brand b { display: block; font: 400 26px/1 "Instrument Serif", Georgia, serif; } .brand { padding-bottom: 20px; border-bottom: 1px solid var(--ink); } .brand small { display: block; margin-top: 6px; letter-spacing: .14em; text-transform: uppercase; font-size: 11px !important; font-weight: 600; } .brand small { color: var(--muted); font-size: 12px; }
.eyebrow { color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
h1 { margin: 10px 0 32px; font: 400 clamp(40px, 9vw, 52px)/1.02 "Instrument Serif", Georgia, serif; letter-spacing: -.02em; text-wrap: balance; }
label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.input { position: relative; margin-bottom: 16px; }
.input i { position: absolute; left: 0; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; pointer-events: none; }
.input input { width: 100%; height: 48px; padding: 0 2px 0 30px; border-radius: 0; border: 0; border-bottom: 1px solid var(--line-2); background: transparent; color: var(--ink); font: inherit; font-size: 16px; transition: border-color .12s; }
.input input:focus { outline: none; border-color: var(--ink); box-shadow: 0 1px 0 0 var(--ink); }
button { width: 100%; height: 48px; border: 1px solid var(--inv); border-radius: 99px; background: var(--inv); color: var(--inv-ink); font: 600 14.5px "Manrope Variable", "Manrope", sans-serif; cursor: pointer; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity .12s; }
button:hover { opacity: .86; }
button:disabled { opacity: .5; cursor: wait; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.error { display: none; margin-bottom: 16px; padding: 10px 14px; border: 1px solid var(--ink); color: var(--ink); border-radius: 10px; font-size: 13px; font-weight: 700; }
.error.show { display: flex; gap: 8px; align-items: center; }
.error.show::before { content: "!"; flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--inv); color: var(--inv-ink); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.foot { margin: 28px 0 0; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; text-align: center; }
@media (max-width: 30rem) { body { padding: 0; place-items: stretch; } .card { padding: 40px 24px 32px; min-height: 100dvh; } }
</style>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }</script>
</head>
<body>
<main class="card">
  <div class="brand"><div class="tile"><i class="ph-fill ph-books" aria-hidden="true"></i></div><div><b>Pengingat Kuliah</b><small>Jadwal · Tugas · Ujian</small></div></div>
  <div class="eyebrow">Akses Pengingat Kuliah</div>
  <h1>Masuk untuk melihat <em>jadwal kuliah</em>.</h1>
  <div class="error" id="err" role="alert" aria-live="assertive"></div>
  <form id="f">
    <label for="u">Username</label>
    <div class="input"><i class="ph ph-user" aria-hidden="true"></i><input id="u" name="username" autocomplete="username" autocapitalize="none" required></div>
    <label for="p">Password</label>
    <div class="input"><i class="ph ph-lock-key" aria-hidden="true"></i><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <button id="b"><i class="ph ph-sign-in" aria-hidden="true"></i> Masuk</button>
  </form>
  <p class="foot">Belum punya akun? Minta ke admin kelas.</p>
</main>
<script>
const f = document.getElementById('f'), err = document.getElementById('err'), b = document.getElementById('b');
try { if (sessionStorage.getItem('token')) location.replace('/'); } catch {}
f.addEventListener('submit', async (e) => {
  e.preventDefault(); err.classList.remove('show'); b.disabled = true; b.lastChild.textContent = ' Memeriksa…';
  try {
    const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(f))) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Gagal masuk');
    try { sessionStorage.setItem('token', j.token); } catch {}
    const next = new URLSearchParams(location.search).get('next');
    location.replace(next && next.startsWith('/') && !next.startsWith('//') ? next : '/');
  } catch (e2) { err.textContent = e2.message; err.classList.add('show'); b.disabled = false; b.lastChild.textContent = ' Masuk'; }
});
</script>
</body>
</html>
