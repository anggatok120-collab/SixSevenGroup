<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · Pengingat Kuliah</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e7490'/%3E%3Cpath d='M9 8h6v16H9zM17 8h6v16h-6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/manrope/index.css">
<link rel="stylesheet" href="/vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="/vendor/phosphor/fill/style.css">
<link rel="stylesheet" href="/vendor/phosphor/bold/style.css">
<link rel="stylesheet" href="/vendor/phosphor/duotone/style.css">
<style>
:root { --bg:#f2f8fc; --card:#fff; --line:#c9dbe5; --ink:#0f2533; --muted:#4a6272; --accent:#0e6a96; --tile:#dff1f9; --field:#f7fbfd; --err:#dc2626; --err-bg:#fef2f2; }
@media (prefers-color-scheme: dark) { :root { --bg:#061722; --card:#0e2938; --line:#1c3d50; --ink:#e8f4fa; --muted:#8fb0c2; --accent:#38aee3; --tile:#123a4f; --field:#0a2230; --err:#f87171; --err-bg:#2d1414; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 20px 16px; font: 15px/1.5 "Manrope Variable", "Manrope", system-ui, sans-serif; color: var(--ink);
  background: radial-gradient(60rem 30rem at 50% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%), var(--bg); }
.card { width: min(29rem, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 1.25rem; padding: 2.5rem; box-shadow: 0 24px 70px rgba(7,50,73,.12); }
.brand { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.75rem; }
.tile { width: 2.75rem; height: 2.75rem; border-radius: .8rem; background: var(--tile); color: var(--accent); display: grid; place-items: center; font-size: 1.5rem; }
.brand b { display: block; font-size: 1rem; } .brand small { color: var(--muted); font-size: .8rem; }
.eyebrow { color: var(--accent); font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
h1 { margin: .35rem 0 1.6rem; font-size: clamp(1.75rem, 6vw, 2.35rem); line-height: 1.08; letter-spacing: -.05em; }
label { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: .4rem; }
.input { position: relative; margin-bottom: 1rem; }
.input i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 1.15rem; }
.input input { width: 100%; height: 3.15rem; padding: 0 1rem 0 2.8rem; border-radius: .8rem; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; font-size: 16px; }
.input input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
button { width: 100%; height: 3.15rem; border: 0; border-radius: .8rem; background: var(--accent); color: #fff; font: 800 .95rem "Manrope Variable", "Manrope", sans-serif; cursor: pointer; margin-top: .5rem; display: flex; align-items: center; justify-content: center; gap: .5rem; }
button:disabled { opacity: .6; cursor: wait; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.error { display: none; margin-bottom: 1rem; padding: .7rem .9rem; border-left: 3px solid var(--err); background: var(--err-bg); color: var(--err); border-radius: .4rem; font-size: .85rem; font-weight: 600; }
.error.show { display: block; }
.foot { margin-top: 1.5rem; color: var(--muted); font-size: .8rem; text-align: center; }
@media (max-width: 30rem) { body { padding: 0; place-items: stretch; } .card { border-radius: 0; border: 0; padding: 2rem 1.5rem; min-height: 100dvh; } }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="tile"><i class="ph-fill ph-books" aria-hidden="true"></i></div><div><b>Pengingat Kuliah</b><small>Jadwal · Tugas · Ujian</small></div></div>
  <div class="eyebrow">Akses Pengingat Kuliah</div>
  <h1>Masuk untuk melihat jadwal kuliah.</h1>
  <div class="error" id="err" role="alert" aria-live="assertive"></div>
  <form id="f">
    <label for="u">Username</label>
    <div class="input"><i class="ph ph-user" aria-hidden="true"></i><input id="u" name="username" autocomplete="username" autocapitalize="none" required></div>
    <label for="p">Password</label>
    <div class="input"><i class="ph ph-lock-key" aria-hidden="true"></i><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <button id="b"><i class="ph ph-sign-in" aria-hidden="true"></i> Masuk</button>
  </form>
  <p class="foot">Belum punya akun? Minta ke admin kelas.</p>
</main>
<script>
const f = document.getElementById('f'), err = document.getElementById('err'), b = document.getElementById('b');
try { if (sessionStorage.getItem('token')) location.replace('/'); } catch {}
f.addEventListener('submit', async (e) => {
  e.preventDefault(); err.classList.remove('show'); b.disabled = true; b.lastChild.textContent = ' Memeriksa…';
  try {
    const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(f))) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Gagal masuk');
    try { sessionStorage.setItem('token', j.token); } catch {}
    const next = new URLSearchParams(location.search).get('next');
    location.replace(next && next.startsWith('/') && !next.startsWith('//') ? next : '/');
  } catch (e2) { err.textContent = e2.message; err.classList.add('show'); b.disabled = false; b.lastChild.textContent = ' Masuk'; }
});
</script>
</body>
</html>
